<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>octanepixels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #08080c;
      --surface: #111118;
      --border: #1e1e2a;
      --text: #f0f0f5;
      --muted: #5a5a72;
      --accent: #6c5ce7;
      --green: #00d2a0;
      --fire1: #ff4500;
      --fire2: #ff8c00;
      --fire3: #ffd700;
    }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .bg-gradient {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: 
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(108,92,231,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(0,210,160,0.05) 0%, transparent 50%),
        radial-gradient(ellipse 40% 50% at 10% 60%, rgba(108,92,231,0.04) 0%, transparent 50%);
    }

    .bg-gradient::after {
      content: '';
      position: absolute;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      opacity: 0.4;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
    }

    .logo {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(1.5rem, 5vw, 3rem);
      margin-bottom: 1.5rem;
      display: inline-flex;
      align-items: baseline;
      gap: 0;
      image-rendering: pixelated;
    }

    .logo span { color: var(--text); }

    .logo .burning {
      position: relative;
      display: inline-block;
      color: var(--text);
      text-shadow: 0 0 8px var(--fire1), 0 0 16px var(--fire2), 0 0 28px rgba(255,69,0,0.3);
      animation: burn-pulse 1.5s ease-in-out infinite;
    }

    .logo .burning::before,
    .logo .burning::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: 80%;
      width: 4px;
      height: 4px;
      background: var(--fire3);
      border-radius: 0;
      image-rendering: pixelated;
    }

    .logo .burning::before {
      animation: ember 0.8s infinite;
      transform: translateX(-6px);
    }
    .logo .burning::after {
      animation: ember 1.1s infinite 0.3s;
      transform: translateX(4px);
    }

    /* Pixel fire particles above the O */
    .fire-container {
      position: absolute;
      bottom: 70%;
      left: 0;
      right: 0;
      height: 40px;
      pointer-events: none;
      overflow: visible;
    }

    .fire-pixel {
      position: absolute;
      width: 4px;
      height: 4px;
      image-rendering: pixelated;
      animation: rise 0.9s infinite;
    }

    @keyframes burn-pulse {
      0%, 100% { 
        text-shadow: 0 0 8px #ff4500, 0 0 16px #ff8c00, 0 0 28px rgba(255,69,0,0.3);
      }
      25% { 
        text-shadow: 0 0 10px #ff8c00, 0 0 20px #ffd700, 0 0 32px rgba(255,140,0,0.4);
      }
      50% { 
        text-shadow: 0 0 6px #ff2200, 0 0 14px #ff4500, 0 0 24px rgba(255,69,0,0.5);
      }
      75% { 
        text-shadow: 0 0 9px #ff6a00, 0 0 18px #ff8c00, 0 0 30px rgba(255,100,0,0.35);
      }
    }

    @keyframes ember {
      0% { opacity: 1; transform: translateX(-6px) translateY(0) scale(1); background: #ffd700; }
      50% { opacity: 0.8; background: #ff8c00; }
      100% { opacity: 0; transform: translateX(-6px) translateY(-20px) scale(0.5); background: #ff4500; }
    }

    @keyframes rise {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-30px) scale(0.3); }
    }

    .tagline {
      font-size: clamp(0.9rem, 2vw, 1.1rem);
      color: var(--muted);
      font-weight: 400;
      letter-spacing: 0.02em;
      margin-bottom: 3rem;
    }

    .links {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .links a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.7rem 1.4rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.25s ease;
    }

    .links a:hover {
      border-color: var(--accent);
      background: rgba(108,92,231,0.08);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(108,92,231,0.1);
    }

    .links a svg { width: 18px; height: 18px; opacity: 0.7; }

    .divider {
      width: 40px;
      height: 1px;
      background: var(--border);
      margin: 2.5rem auto;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    .particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: var(--accent);
      border-radius: 50%;
      opacity: 0;
      animation: float 8s infinite;
    }
    @keyframes float {
      0%, 100% { opacity: 0; transform: translateY(0) scale(1); }
      50% { opacity: 0.4; transform: translateY(-80px) scale(1.5); }
    }

    @media (max-width: 600px) {
      .links { flex-direction: column; align-items: center; }
      .links a { width: 100%; max-width: 240px; justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="particles" id="particles"></div>

  <div class="container">
    <h1 class="logo">
      <span class="burning" id="burning-o">o
        <div class="fire-container" id="fire-container"></div>
      </span><span>ctanepixels</span>
    </h1>

    <div class="links">
      <a href="https://github.com/octanepixels" target="_blank">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
        GitHub
      </a>
      <a href="https://instagram.com/octanepixels" target="_blank">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
        Instagram
      </a>
    </div>

    <div class="divider"></div>
    <p class="mono">⬡</p>
  </div>

  <script>
    // Background particles
    const container = document.getElementById('particles');
    for (let i = 0; i < 20; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.top = Math.random() * 100 + '%';
      p.style.animationDelay = Math.random() * 8 + 's';
      p.style.animationDuration = (6 + Math.random() * 6) + 's';
      container.appendChild(p);
    }

    // Pixel fire on the O
    const fireContainer = document.getElementById('fire-container');
    const fireColors = ['#ffd700', '#ff8c00', '#ff6a00', '#ff4500', '#ff2200'];

    function spawnFirePixel() {
      const pixel = document.createElement('div');
      pixel.className = 'fire-pixel';
      pixel.style.left = (Math.random() * 100) + '%';
      pixel.style.bottom = '0';
      pixel.style.background = fireColors[Math.floor(Math.random() * fireColors.length)];
      pixel.style.animationDuration = (0.4 + Math.random() * 0.6) + 's';
      pixel.style.width = (3 + Math.random() * 3) + 'px';
      pixel.style.height = pixel.style.width;
      pixel.style.boxShadow = `0 0 3px ${pixel.style.background}`;
      fireContainer.appendChild(pixel);
      setTimeout(() => pixel.remove(), 1000);
    }

    setInterval(spawnFirePixel, 80);
  </script>
</body>
</html>
